version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  show-stats: true

linters:
  enable:
    # Core
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Quality
    - revive
    - gosec
    - bodyclose
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - godot
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goprintffuncname
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - thelper
    - unconvert
    - unparam
    - whitespace
    - testpackage
    - paralleltest
    - tparallel
    - wastedassign
    - nilnil
    - exhaustruct
    - varnamelen
    - forbidigo
    - cyclop

    # Safety / correctness
    - asasalint
    - bidichk
    - canonicalheader
    - containedctx
    - contextcheck
    - dogsled
    - durationcheck
    - errchkjson
    - fatcontext
    - forcetypeassert
    - makezero
    - nilnesserr
    - nosprintfhostport
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars

    # Modernization / tests / performance
    - copyloopvar
    - modernize
    - perfsprint
    - testifylint
    - dupword
    - zerologlint

    # Logging
    - loggercheck
    - sloglint

    # Strict style / API hygiene
    - embeddedstructfieldcheck
    - funcorder
    - gochecknoglobals
    - godoclint
    - gomodguard_v2
    - inamedparam
    - interfacebloat
    - intrange
    - protogetter
    - ireturn
    - mnd
    - musttag
    - nestif
    - nlreturn
    - tagliatelle
    - wrapcheck
    - wsl_v5

  exclusions:
    rules:
      - linters: [all]
        path: ".*\\.pb\\.go$"
      - linters: [all]
        path: ".*_generated\\.go$"
      - linters: [lll]
        source: "^//go:generate "
      # Go linker flags require writable package-level variables.
      - linters: [gochecknoglobals]
        path: "internal/vinfo/version\\.go$"

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50

    varnamelen:
      min-name-length: 2
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-decls:
        - i int
        - n int
        - r io.Reader
        - w io.Writer
        - b []byte
        - s string
        - t *testing.T
        - b *testing.B
        - ctx context.Context

    dupl:
      threshold: 100

    goconst:
      min-len: 3
      min-occurrences: 3

    lll:
      line-length: 120
      tab-width: 4

    misspell:
      locale: US

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^interface\{\}$
          msg: empty interface banned; use a typed alternative.

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      config:
        global:
          nosec: true
          audit: true

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          mapstructure: snake

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    exhaustruct:
      include:
        - ^github\.com/omarluq/sumi/.*
